<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 4</title>
    <link rel="stylesheet" href="./css/common.css" />
  </head>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    body > p {
      position: absolute;
      top: 20px;
      left: 20px;
    }

    .login-form {
      width: 408px;
      height: 256px;

      padding: 24px;
      box-sizing: border-box;

      background: #ffffff;
      border-radius: 8px;

      display: flex;
      flex-direction: column;
      gap: 16px;
    }


    .login-form label {
      font-family: var(--font-family);
      font-weight: 400;
      font-size: 16px;
      line-height: 150%;
      letter-spacing: 0.04em;
      color: #2e2f42;
    }

    .login-form input {
      width: 360px;
      height: 40px;
      margin-top: 8px;
      box-sizing: border-box;
      border: 1px solid #808080;
      border-radius: 4px;
      padding: 8px;
      font-size: 16px;
    }


    .login-form button {
      border-radius: 8px;
      padding: 8px 16px;
      width: 86px;
      height: 40px;
      background: #4e75ff;
      cursor: pointer;
      border: none;
      font-family: var(--font-family);
      font-weight: 500;
      font-size: 16px;
      line-height: 150%;
      letter-spacing: 0.04em;
      color: #fff;
    }


    .login-form button:hover {
      background: #6c8cff;
    }
  </style>  
  <body>
    <p><a href="./index.html">Go back</a></p>

    <form class="login-form">
      <label>
        Email
        <input type="email" name="email" />
      </label>
      <label>
        Password
        <input type="password" name="password" />
      </label>
      <button type="submit">Login</button>
    </form>

    <script src="./js/task-4.js" type="module"></script>
  </body>
</html>

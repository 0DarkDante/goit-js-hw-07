<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 5</title>
    <link rel="stylesheet" href="./css/common.css" />
    <style>
      body {
        font-family: Arial, sans-serif;
      }

      .widget {
        width: 345px;
        height: 280px;
        padding: 100px 88px;
        border-radius: 8px;
        background: #fff;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 16px;
      }

      .widget p {
        margin: 0;
        font-size: 14px;
        line-height: 20px;
        color: #2e2f42;
      }

      .change-color {
        border-radius: 8px;
        padding: 8px 16px;
        width: 148px;
        height: 40px;
        font-family: var(--font-family);
        font-weight: 500;
        font-size: 16px;
        line-height: 150%;
        letter-spacing: 0.04em;
        color: #fff;
        background: #4e75ff;
        border: none;
        cursor: pointer;
      }

      .change-color:hover {
        background: #6c8cff;
      }
    </style>
  </head>
  <body>
    <p><a href="./index.html">Go back</a></p>

    <div class="widget">
      <p>Background color: <span class="color">-</span></p>
      <button type="button" class="change-color">Change color</button>
    </div>

    <script src="./js/task-5.js" type="module"></script>
  </body>
</html>

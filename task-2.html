<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 2</title>
    <link rel="stylesheet" href="./css/common.css" />
    <style>
      .gallery {
        width: 1128px;
        height: 300px;
        padding: 0;
        margin: 0 auto;
        list-style: none;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: 48px 16px;
      }

      .gallery-item {
        overflow: hidden;
        width: 360px;
        height: 300px;
      }

      .gallery-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
    </style>  
  </head>
  <body>
    <p><a href="./index.html">Go back</a></p>

    <ul class="gallery"></ul>

    <script src="./js/task-2.js" type="module"></script>
  </body>
</html>
